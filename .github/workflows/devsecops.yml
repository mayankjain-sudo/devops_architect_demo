name: Enterprise DevSecOps Pipeline
 
on:
  push:
    branches: ["**"]
    tags: ["v*"]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  # We use the SHA for the tag, but we will sign by Digest
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m py_compile app.py

  dependency-scan:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

  docker:
    runs-on: ubuntu-latest
    needs: dependency-scan
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # Using build-push-action makes capturing the digest much easier
      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  container-scan:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: aquasecurity/trivy-action@master
        with:
          # Use the digest for scanning too—it's more secure!
          image-ref: "${{ env.IMAGE_NAME }}@${{ needs.docker.outputs.image_digest }}"
          severity: "HIGH,CRITICAL"
          exit-code: "0"
 
  cosign-sign:
    runs-on: ubuntu-latest
    needs: [docker, container-scan] # Needs both to ensure scan finishes
    permissions:
      id-token: write
      packages: write
      contents: read
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign Image
        run: |
          # We sign using the IMAGE_NAME @ DIGEST
          cosign sign --yes "${{ env.IMAGE_NAME }}@${{ needs.docker.outputs.image_digest }}"

  deploy-dev:
    if: startsWith(github.ref, 'refs/heads/feature')
    runs-on: ubuntu-latest
    needs: cosign-sign
    environment: dev
    permissions:
      id-token: write  # Needed to verify against Sigstore's transparency log
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        
      - name: Verify Image Signature
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/main.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ env.IMAGE_NAME }}@${{ needs.docker.outputs.image_digest }}"
            
      - name: Deploy
        run: echo "Verified! Deploying to DEV via GitOps..."

  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: cosign-sign
    environment: production
    permissions:
      id-token: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        
      - name: Verify Image Signature
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/main.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ env.IMAGE_NAME }}@${{ needs.docker.outputs.image_digest }}"

      - name: Deploy
        run: echo "Verified! Manual Approval Required for Production..."